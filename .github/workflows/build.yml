name: Build & Release (Check Entry)

on:
  push:
    tags: ['v*']
    branches: ['check-entry']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dist directory structure
        run: |
          mkdir -p dist
          cp manifest.json dist/
          cp background.js content.js dist/
          cp -r popup offscreen icons dist/
          cp README.md dist/

      - name: Create zip
        run: |
          cd dist
          zip -r ../carrybee-check-entry-${{ github.ref_name }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: carrybee-check-entry-${{ github.ref_name }}
          path: carrybee-check-entry-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Flatten artifact folders
        run: |
          for d in carrybee-check-entry-*/; do
            if [ -d "$d" ]; then find "$d" -maxdepth 1 -name '*.zip' -exec mv {} . \; ; fi
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: carrybee-check-entry-*.zip
          generate_release_notes: true
          body: |
            ## CarryBee Check Entry ${{ github.ref_name }}

            ### Installation
            1. Download the zip file below
            2. Extract the zip
            3. Open Chrome → `chrome://extensions/`
            4. Enable "Developer mode"
            5. Click "Load unpacked" → select the extracted folder
               (the folder containing `manifest.json`)

            ### Flow (mouse-free)
            1. Copy the Business Name (`Ctrl+C` in Google Sheets)
            2. Press `Alt+Q` → popup opens focused, Business Name filled,
               caret lands in the Phone field
            3. Type the customer's phone → `Enter`
            4. Result shows in the popup

            ### Owner
            **Abu Taher**

            ### GitHub
            https://github.com/devabutaher/carrybee-extension
